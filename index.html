<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>領収書発行アプリ｜メナード北谷美浜店</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.5/JsBarcode.all.min.js"></script>
<style>
  :root {
    --primary: #c8860a;
    --primary-light: #f5e6c8;
    --primary-dark: #8a5c00;
    --accent: #2d6a4f;
    --accent-light: #d8f3dc;
    --bg: #fafaf8;
    --card: #ffffff;
    --border: #e0d8cc;
    --text: #2c2416;
    --text-muted: #8a7a60;
    --danger: #c0392b;
    --danger-light: #fdecea;
    --shadow: 0 2px 12px rgba(0,0,0,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Helvetica Neue', Arial, 'Hiragino Sans', 'Meiryo', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }

  /* Header */
  .app-header { background: linear-gradient(135deg, var(--primary-dark), var(--primary)); color: white; padding: 16px 24px; display: flex; align-items: center; gap: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
  .app-header .logo { font-size: 22px; font-weight: 700; letter-spacing: 1px; }
  .app-header .sub { font-size: 12px; opacity: 0.85; margin-top: 2px; }

  /* Layout */
  .container { max-width: 960px; margin: 0 auto; padding: 20px 16px; display: grid; grid-template-columns: 1fr 380px; gap: 16px; }
  @media(max-width:760px){ .container{ grid-template-columns:1fr; } }

  /* Card */
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
  .card-header { background: var(--primary-light); border-bottom: 1px solid var(--border); padding: 12px 16px; font-weight: 700; color: var(--primary-dark); font-size: 13px; display: flex; align-items: center; gap: 8px; }
  .card-body { padding: 16px; }

  /* Tabs */
  .tabs { display: flex; border-bottom: 2px solid var(--border); margin-bottom: 16px; }
  .tab { padding: 8px 16px; cursor: pointer; font-size: 13px; color: var(--text-muted); border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all 0.2s; }
  .tab.active { color: var(--primary-dark); border-bottom-color: var(--primary); font-weight: 700; }
  .tab-pane { display: none; }
  .tab-pane.active { display: block; }

  /* Form elements */
  label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 4px; }
  input, select { width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; color: var(--text); background: white; outline: none; transition: border 0.2s; }
  input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(200,134,10,0.12); }
  .form-row { margin-bottom: 12px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }

  /* Barcode section */
  .scan-area { border: 2px dashed var(--primary); border-radius: 10px; padding: 16px; text-align: center; background: var(--primary-light); margin-bottom: 12px; cursor: pointer; transition: background 0.2s; }
  .scan-area:hover { background: #f0d9a0; }
  .scan-icon { font-size: 32px; margin-bottom: 6px; }
  .scan-hint { font-size: 12px; color: var(--text-muted); }
  #camera-view { display: none; width: 100%; border-radius: 8px; margin-top: 8px; }
  #barcode-input { font-size: 16px; letter-spacing: 2px; text-align: center; }

  /* Items table */
  .items-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .items-table th { background: var(--primary-light); color: var(--primary-dark); padding: 8px 6px; text-align: center; font-size: 12px; border-bottom: 2px solid var(--border); }
  .items-table td { padding: 7px 6px; border-bottom: 1px solid #f0ebe0; vertical-align: middle; }
  .items-table tr:hover td { background: #fdf8ef; }
  .items-table input { padding: 5px 7px; font-size: 13px; }
  .tax-badge { display: inline-block; font-size: 10px; padding: 1px 5px; border-radius: 10px; font-weight: 700; }
  .tax-8 { background: var(--accent-light); color: var(--accent); }
  .tax-10 { background: #e8f0fe; color: #1a56a0; }
  .btn-del { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 16px; padding: 2px 6px; border-radius: 4px; }
  .btn-del:hover { background: var(--danger-light); }

  /* Buttons */
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 18px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
  .btn-primary { background: var(--primary); color: white; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-success { background: var(--accent); color: white; }
  .btn-success:hover { background: #1b4332; }
  .btn-outline { background: white; border: 1px solid var(--border); color: var(--text); }
  .btn-outline:hover { border-color: var(--primary); color: var(--primary-dark); }
  .btn-sm { padding: 6px 12px; font-size: 12px; }
  .btn-block { width: 100%; justify-content: center; }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }

  /* Summary panel */
  .summary-box { background: var(--primary-light); border-radius: 10px; padding: 14px; margin-bottom: 12px; }
  .summary-row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; color: var(--text); }
  .summary-row.total { font-size: 18px; font-weight: 700; color: var(--primary-dark); border-top: 1px solid var(--border); padding-top: 8px; margin-top: 4px; }
  .summary-row.discount { color: var(--danger); font-weight: 600; }

  /* Receipt preview */
  #receipt-preview { font-size: 12px; background: white; padding: 20px; border: 1px solid var(--border); border-radius: 8px; line-height: 1.8; }
  #receipt-preview h2 { text-align: center; font-size: 18px; margin-bottom: 4px; }
  #receipt-preview .r-center { text-align: center; }
  #receipt-preview .r-right { text-align: right; }
  #receipt-preview .r-line { border-top: 1px dashed #ccc; margin: 8px 0; }
  #receipt-preview table { width: 100%; font-size: 11px; }
  #receipt-preview table td { padding: 2px 4px; }

  /* Upload */
  .upload-box { border: 2px dashed var(--border); border-radius: 8px; padding: 20px; text-align: center; cursor: pointer; }
  .upload-box:hover { border-color: var(--primary); background: var(--primary-light); }
  .master-table { width: 100%; border-collapse: collapse; font-size: 12px; max-height: 200px; overflow-y: auto; display: block; }
  .master-table th, .master-table td { border: 1px solid var(--border); padding: 5px 8px; text-align: left; }
  .master-table th { background: var(--primary-light); color: var(--primary-dark); }

  /* Toast */
  #toast { position: fixed; bottom: 24px; right: 24px; background: #2d2d2d; color: white; padding: 12px 20px; border-radius: 10px; font-size: 13px; opacity: 0; transform: translateY(20px); transition: all 0.3s; pointer-events: none; z-index: 9999; }
  #toast.show { opacity: 1; transform: translateY(0); }

  .highlight { animation: flash 0.5s ease; }
  @keyframes flash { 0%,100%{background:white} 50%{background:#fff9e0} }

  .empty-state { text-align: center; color: var(--text-muted); padding: 24px; font-size: 13px; }
</style>
</head>
<body>

<div class="app-header">
  <div>
    <div class="logo">🌸 メナード北谷美浜店</div>
    <div class="sub">領収書発行システム</div>
  </div>
</div>

<div class="container">
  <!-- LEFT PANEL -->
  <div>
    <!-- Scan / Input Card -->
    <div class="card" style="margin-bottom:16px">
      <div class="card-header">📦 商品追加</div>
      <div class="card-body">
        <div class="tabs">
          <div class="tab active" onclick="switchTab('scan')">📷 スキャン</div>
          <div class="tab" onclick="switchTab('manual')">✏️ 手入力</div>
        </div>

        <!-- Scan Tab -->
        <div class="tab-pane active" id="tab-scan">
          <div class="form-row">
            <label>バーコード入力（USBリーダー or 手打ち）</label>
            <input type="text" id="barcode-input" placeholder="バーコードをスキャン / 入力してEnter" autofocus>
          </div>
          <div class="scan-area" onclick="toggleCamera()" id="camera-toggle">
            <div class="scan-icon">📷</div>
            <div style="font-weight:600;margin-bottom:4px">カメラでスキャン</div>
            <div class="scan-hint">クリックしてカメラを起動</div>
          </div>
          <video id="camera-view" autoplay playsinline></video>
          <canvas id="camera-canvas" style="display:none"></canvas>
          <div id="scan-status" style="font-size:12px;color:var(--text-muted);text-align:center;margin-top:4px"></div>
        </div>

        <!-- Manual Tab -->
        <div class="tab-pane" id="tab-manual">
          <div class="form-row">
            <label>商品名</label>
            <input type="text" id="m-name" placeholder="例：ホワイトニングクリーム">
          </div>
          <div class="form-grid">
            <div class="form-row">
              <label>単価（税抜）</label>
              <input type="number" id="m-price" placeholder="0">
            </div>
            <div class="form-row">
              <label>数量</label>
              <input type="number" id="m-qty" value="1" min="1">
            </div>
          </div>
          <div class="form-grid">
            <div class="form-row">
              <label>税率</label>
              <select id="m-tax">
                <option value="10">10%（標準）</option>
                <option value="8">8%（軽減）</option>
              </select>
            </div>
            <div class="form-row">
              <label>割引率（%）</label>
              <input type="number" id="m-discount" value="0" min="0" max="100" placeholder="0">
            </div>
          </div>
          <button class="btn btn-primary btn-block" onclick="addManualItem()">＋ 追加</button>
        </div>
      </div>
    </div>

    <!-- Items Card -->
    <div class="card">
      <div class="card-header">
        🛍️ 明細リスト
        <button class="btn btn-sm btn-outline" style="margin-left:auto" onclick="clearItems()">🗑 全クリア</button>
      </div>
      <div class="card-body" style="padding:0;overflow-x:auto">
        <table class="items-table">
          <thead>
            <tr>
              <th>商品名</th>
              <th>単価</th>
              <th>数量</th>
              <th>割引</th>
              <th>税</th>
              <th>小計</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="items-tbody">
            <tr><td colspan="7" class="empty-state">商品を追加してください</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div>
    <!-- Recipient -->
    <div class="card" style="margin-bottom:16px">
      <div class="card-header">👤 宛名・日付</div>
      <div class="card-body">
        <div class="form-row">
          <label>宛名</label>
          <input type="text" id="recipient" placeholder="〇〇　様">
        </div>
        <div class="form-row">
          <label>但し書き</label>
          <input type="text" id="purpose" value="化粧品代として">
        </div>
        <div class="form-row">
          <label>発行日</label>
          <input type="date" id="issue-date">
        </div>
        <div class="form-row">
          <label>領収書番号</label>
          <input type="text" id="receipt-no" placeholder="自動生成">
        </div>
      </div>
    </div>

    <!-- Summary -->
    <div class="card" style="margin-bottom:16px">
      <div class="card-header">💰 金額サマリー</div>
      <div class="card-body">
        <div class="summary-box">
          <div class="summary-row"><span>小計（税抜）</span><span id="s-subtotal">¥0</span></div>
          <div class="summary-row discount"><span>値引き合計</span><span id="s-discount">-¥0</span></div>
          <div class="summary-row"><span>消費税 8%対象</span><span id="s-tax8base">¥0</span></div>
          <div class="summary-row"><span>　うち消費税（8%）</span><span id="s-tax8">¥0</span></div>
          <div class="summary-row"><span>消費税10%対象</span><span id="s-tax10base">¥0</span></div>
          <div class="summary-row"><span>　うち消費税（10%）</span><span id="s-tax10">¥0</span></div>
          <div class="summary-row total"><span>合計（税込）</span><span id="s-total">¥0</span></div>
        </div>
        <div class="btn-row">
          <button class="btn btn-primary" style="flex:1" onclick="showPreview()">👁 プレビュー</button>
          <button class="btn btn-success" style="flex:1" onclick="exportExcel()">📥 Excel出力</button>
        </div>
      </div>
    </div>

    <!-- Master Upload -->
    <div class="card">
      <div class="card-header">📂 商品マスター</div>
      <div class="card-body">
        <div class="upload-box" onclick="document.getElementById('master-file').click()">
          <div style="font-size:24px;margin-bottom:6px">📤</div>
          <div style="font-weight:600;margin-bottom:4px">Excel / CSV をアップロード</div>
          <div class="scan-hint">バーコード・商品名・単価・税率・割引率の列</div>
        </div>
        <input type="file" id="master-file" accept=".xlsx,.xls,.csv" style="display:none" onchange="loadMaster(event)">
        <div id="master-status" style="margin-top:8px;font-size:12px;color:var(--text-muted)"></div>
        <div id="master-preview" style="margin-top:8px;overflow-x:auto"></div>
      </div>
    </div>
  </div>
</div>

<!-- Receipt Preview Modal -->
<div id="preview-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;overflow-y:auto;padding:24px">
  <div style="max-width:420px;margin:0 auto;background:white;border-radius:12px;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,0.2)">
    <div style="background:var(--primary);color:white;padding:14px 16px;display:flex;justify-content:space-between;align-items:center">
      <span style="font-weight:700">領収書プレビュー</span>
      <button onclick="closePreview()" style="background:none;border:none;color:white;font-size:20px;cursor:pointer">✕</button>
    </div>
    <div style="padding:20px" id="receipt-preview"></div>
    <div style="padding:16px;border-top:1px solid var(--border);display:flex;gap:8px">
      <button class="btn btn-success btn-block" onclick="exportExcel()">📥 Excel出力</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ========== STATE ==========
let items = [];
let masterData = {};
let cameraActive = false;
let scanInterval = null;

// ========== INIT ==========
document.addEventListener('DOMContentLoaded', () => {
  const today = new Date();
  document.getElementById('issue-date').value = today.toISOString().split('T')[0];
  document.getElementById('receipt-no').value = 'R' + today.getFullYear() + String(today.getMonth()+1).padStart(2,'0') + String(today.getDate()).padStart(2,'0') + '-' + String(Math.floor(Math.random()*1000)).padStart(3,'0');
  document.getElementById('barcode-input').addEventListener('keydown', e => { if(e.key==='Enter') scanBarcode(); });
});

// ========== TABS ==========
function switchTab(name) {
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', ['scan','manual'][i]===name));
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  if(name==='scan') setTimeout(()=>document.getElementById('barcode-input').focus(),100);
}

// ========== BARCODE SCAN (USB/keyboard) ==========
function scanBarcode() {
  const code = document.getElementById('barcode-input').value.trim();
  if(!code) return;
  const product = masterData[code];
  if(product) {
    addItem(product.name, product.price, 1, product.tax||10, product.discount||0, code);
    toast('✅ ' + product.name + ' を追加しました');
  } else {
    // unknown barcode → prefill manual tab
    switchTab('manual');
    document.getElementById('m-name').value = code;
    document.getElementById('m-name').focus();
    toast('⚠️ マスターに未登録のコード。手入力してください。');
  }
  document.getElementById('barcode-input').value = '';
}

// ========== CAMERA SCAN ==========
async function toggleCamera() {
  if(cameraActive) { stopCamera(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    const video = document.getElementById('camera-view');
    video.srcObject = stream;
    video.style.display = 'block';
    document.getElementById('camera-toggle').querySelector('.scan-hint').textContent = 'タップして停止';
    document.getElementById('camera-toggle').querySelector('.scan-icon').textContent = '⏹';
    document.getElementById('scan-status').textContent = 'カメラ起動中... バーコードを画面に向けてください';
    cameraActive = true;
    // Simple scan loop using canvas
    scanInterval = setInterval(() => captureFrame(video), 500);
  } catch(e) {
    toast('❌ カメラにアクセスできません: ' + e.message);
  }
}

function captureFrame(video) {
  if(!cameraActive) return;
  const canvas = document.getElementById('camera-canvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0);
  // BarcodeDetector API (Chrome/Android)
  if('BarcodeDetector' in window) {
    const detector = new BarcodeDetector({ formats: ['ean_13','ean_8','code_128','qr_code'] });
    detector.detect(canvas).then(codes => {
      if(codes.length > 0) {
        const code = codes[0].rawValue;
        document.getElementById('barcode-input').value = code;
        stopCamera();
        scanBarcode();
      }
    }).catch(()=>{});
  }
}

function stopCamera() {
  const video = document.getElementById('camera-view');
  if(video.srcObject) video.srcObject.getTracks().forEach(t=>t.stop());
  video.style.display = 'none';
  clearInterval(scanInterval);
  cameraActive = false;
  document.getElementById('camera-toggle').querySelector('.scan-hint').textContent = 'クリックしてカメラを起動';
  document.getElementById('camera-toggle').querySelector('.scan-icon').textContent = '📷';
  document.getElementById('scan-status').textContent = '';
}

// ========== ITEMS ==========
function addItem(name, price, qty, tax, discount, barcode='') {
  items.push({ name, price: parseFloat(price)||0, qty: parseInt(qty)||1, tax: parseInt(tax)||10, discount: parseFloat(discount)||0, barcode });
  renderItems();
  updateSummary();
}

function addManualItem() {
  const name = document.getElementById('m-name').value.trim();
  const price = document.getElementById('m-price').value;
  const qty = document.getElementById('m-qty').value;
  const tax = document.getElementById('m-tax').value;
  const discount = document.getElementById('m-discount').value;
  if(!name) { toast('⚠️ 商品名を入力してください'); return; }
  if(!price) { toast('⚠️ 単価を入力してください'); return; }
  addItem(name, price, qty, tax, discount);
  document.getElementById('m-name').value='';
  document.getElementById('m-price').value='';
  document.getElementById('m-qty').value='1';
  document.getElementById('m-discount').value='0';
  toast('✅ 追加しました');
}

function removeItem(idx) {
  items.splice(idx,1);
  renderItems();
  updateSummary();
}

function renderItems() {
  const tbody = document.getElementById('items-tbody');
  if(items.length===0){ tbody.innerHTML='<tr><td colspan="7" class="empty-state">商品を追加してください</td></tr>'; return; }
  tbody.innerHTML = items.map((item,i)=>{
    const discountedPrice = item.price * (1 - item.discount/100);
    const subtotal = discountedPrice * item.qty;
    return `<tr class="highlight">
      <td style="min-width:120px">${item.name}</td>
      <td style="text-align:right">¥${item.price.toLocaleString()}</td>
      <td style="text-align:center"><input type="number" value="${item.qty}" min="1" style="width:50px;text-align:center" onchange="items[${i}].qty=parseInt(this.value)||1;renderItems();updateSummary()"></td>
      <td style="text-align:center"><input type="number" value="${item.discount}" min="0" max="100" style="width:52px;text-align:center" onchange="items[${i}].discount=parseFloat(this.value)||0;renderItems();updateSummary()">%</td>
      <td style="text-align:center"><span class="tax-badge tax-${item.tax}">${item.tax}%</span></td>
      <td style="text-align:right;font-weight:600">¥${Math.floor(subtotal).toLocaleString()}</td>
      <td><button class="btn-del" onclick="removeItem(${i})">✕</button></td>
    </tr>`;
  }).join('');
}

function clearItems() { if(confirm('明細をすべてクリアしますか？')){ items=[]; renderItems(); updateSummary(); } }

// ========== SUMMARY ==========
function calcTotals() {
  let subtotal=0, totalDiscount=0, base8=0, base10=0;
  items.forEach(item=>{
    const orig = item.price * item.qty;
    const discAmt = orig * (item.discount/100);
    const after = orig - discAmt;
    subtotal += item.price * item.qty;
    totalDiscount += discAmt;
    if(item.tax===8) base8 += after;
    else base10 += after;
  });
  const tax8 = Math.floor(base8 * 0.08);
  const tax10 = Math.floor(base10 * 0.10);
  const total = Math.floor(base8 + base10) + tax8 + tax10;
  return { subtotal, totalDiscount, base8, base10, tax8, tax10, total };
}

function updateSummary() {
  const c = calcTotals();
  document.getElementById('s-subtotal').textContent = '¥' + Math.floor(c.subtotal).toLocaleString();
  document.getElementById('s-discount').textContent = '-¥' + Math.floor(c.totalDiscount).toLocaleString();
  document.getElementById('s-tax8base').textContent = '¥' + Math.floor(c.base8).toLocaleString();
  document.getElementById('s-tax8').textContent = '¥' + c.tax8.toLocaleString();
  document.getElementById('s-tax10base').textContent = '¥' + Math.floor(c.base10).toLocaleString();
  document.getElementById('s-tax10').textContent = '¥' + c.tax10.toLocaleString();
  document.getElementById('s-total').textContent = '¥' + c.total.toLocaleString();
}

// ========== PREVIEW ==========
function showPreview() {
  if(items.length===0){ toast('⚠️ 商品を追加してください'); return; }
  const c = calcTotals();
  const recipient = document.getElementById('recipient').value || '　　　　　';
  const purpose = document.getElementById('purpose').value;
  const date = document.getElementById('issue-date').value;
  const rno = document.getElementById('receipt-no').value;

  let rows = items.map(item=>{
    const disc = item.discount>0 ? `<span style="color:var(--danger);font-size:10px">(-${item.discount}%)</span>` : '';
    const after = Math.floor(item.price*(1-item.discount/100)*item.qty);
    return `<tr><td>${item.name} ${disc}</td><td style="text-align:right">×${item.qty}</td><td style="text-align:right">¥${after.toLocaleString()}<span class="tax-badge tax-${item.tax}" style="margin-left:4px">${item.tax}%</span></td></tr>`;
  }).join('');

  document.getElementById('receipt-preview').innerHTML = `
    <h2>領 収 書</h2>
    <p class="r-center" style="font-size:11px;color:var(--text-muted)">${rno}</p>
    <div class="r-line"></div>
    <p style="font-size:14px;margin:8px 0">${recipient} 様</p>
    <div style="background:var(--primary-light);border-radius:8px;padding:10px;text-align:center;margin:10px 0">
      <div style="font-size:11px;color:var(--text-muted)">合計金額（税込）</div>
      <div style="font-size:28px;font-weight:700;color:var(--primary-dark)">¥${c.total.toLocaleString()}</div>
    </div>
    <p style="font-size:12px;margin-bottom:10px">但し：${purpose}</p>
    <div class="r-line"></div>
    <table>${rows}</table>
    <div class="r-line"></div>
    <table style="font-size:11px">
      <tr><td>小計（税抜）</td><td style="text-align:right">¥${Math.floor(c.subtotal).toLocaleString()}</td></tr>
      ${c.totalDiscount>0?`<tr><td style="color:var(--danger)">値引き</td><td style="text-align:right;color:var(--danger)">-¥${Math.floor(c.totalDiscount).toLocaleString()}</td></tr>`:''}
      <tr><td>8%対象（税抜）</td><td style="text-align:right">¥${Math.floor(c.base8).toLocaleString()}</td></tr>
      <tr><td>　消費税8%</td><td style="text-align:right">¥${c.tax8.toLocaleString()}</td></tr>
      <tr><td>10%対象（税抜）</td><td style="text-align:right">¥${Math.floor(c.base10).toLocaleString()}</td></tr>
      <tr><td>　消費税10%</td><td style="text-align:right">¥${c.tax10.toLocaleString()}</td></tr>
    </table>
    <div class="r-line"></div>
    <p class="r-right" style="font-size:11px;color:var(--text-muted)">${date}</p>
    <p class="r-center" style="margin-top:8px;font-size:13px;font-weight:700">メナード北谷美浜店</p>
    <p class="r-center" style="font-size:11px;color:var(--text-muted)">沖縄県中頭郡北谷町美浜</p>
  `;
  document.getElementById('preview-modal').style.display='block';
}

function closePreview() { document.getElementById('preview-modal').style.display='none'; }

// ========== EXCEL EXPORT ==========
function exportExcel() {
  if(items.length===0){ toast('⚠️ 商品を追加してください'); return; }
  const c = calcTotals();
  const recipient = document.getElementById('recipient').value;
  const purpose = document.getElementById('purpose').value;
  const date = document.getElementById('issue-date').value;
  const rno = document.getElementById('receipt-no').value;

  const wb = XLSX.utils.book_new();
  const ws_data = [
    ['領収書'],
    [''],
    ['領収書番号', rno],
    ['発行日', date],
    [''],
    ['宛名', recipient + ' 様'],
    ['但し書き', purpose],
    [''],
    ['商品名', '単価（税抜）', '数量', '割引率', '割引後単価', '税率', '小計（税抜）'],
    ...items.map(item=>[
      item.name,
      item.price,
      item.qty,
      item.discount + '%',
      Math.floor(item.price*(1-item.discount/100)),
      item.tax + '%',
      Math.floor(item.price*(1-item.discount/100)*item.qty)
    ]),
    [''],
    ['小計（税抜）', '', '', '', '', '', Math.floor(c.subtotal)],
    ['値引き合計', '', '', '', '', '', -Math.floor(c.totalDiscount)],
    ['8%対象（税抜）', '', '', '', '', '', Math.floor(c.base8)],
    ['消費税8%', '', '', '', '', '', c.tax8],
    ['10%対象（税抜）', '', '', '', '', '', Math.floor(c.base10)],
    ['消費税10%', '', '', '', '', '', c.tax10],
    ['合計（税込）', '', '', '', '', '', c.total],
    [''],
    ['発行者', 'メナード北谷美浜店'],
    ['所在地', '沖縄県中頭郡北谷町美浜'],
  ];

  const ws = XLSX.utils.aoa_to_sheet(ws_data);
  ws['!cols'] = [{wch:24},{wch:14},{wch:8},{wch:10},{wch:14},{wch:8},{wch:14}];
  XLSX.utils.book_append_sheet(wb, ws, '領収書');

  const fname = `領収書_${rno}_${date}.xlsx`;
  XLSX.writeFile(wb, fname);
  toast('📥 ' + fname + ' をダウンロードしました');
  closePreview();
}

// ========== MASTER UPLOAD ==========
function loadMaster(event) {
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      let rows = [];
      if(file.name.endsWith('.csv')) {
        const text = new TextDecoder('utf-8').decode(e.target.result);
        rows = text.trim().split('\n').map(r=>r.split(',').map(c=>c.trim().replace(/^"|"$/g,'')));
      } else {
        const wb = XLSX.read(e.target.result, {type:'array'});
        const ws = wb.Sheets[wb.SheetNames[0]];
        rows = XLSX.utils.sheet_to_json(ws, {header:1});
      }
      masterData = {};
      const header = rows[0].map(h=>(h||'').toString().toLowerCase());
      const colBarcode = header.findIndex(h=>h.includes('バーコード')||h.includes('barcode')||h.includes('jan'));
      const colName = header.findIndex(h=>h.includes('商品名')||h.includes('name'));
      const colPrice = header.findIndex(h=>h.includes('単価')||h.includes('price')||h.includes('価格'));
      const colTax = header.findIndex(h=>h.includes('税率')||h.includes('tax'));
      const colDiscount = header.findIndex(h=>h.includes('割引')||h.includes('discount'));

      let count=0;
      rows.slice(1).forEach(row=>{
        if(!row[colBarcode]||!row[colName]) return;
        const code = String(row[colBarcode]).trim();
        masterData[code] = {
          name: row[colName]||'',
          price: parseFloat(row[colPrice])||0,
          tax: parseInt(row[colTax])||10,
          discount: parseFloat(row[colDiscount])||0
        };
        count++;
      });
      document.getElementById('master-status').innerHTML = `<span style="color:var(--accent)">✅ ${count}件の商品を読み込みました</span>`;
      // Preview
      const preview = Object.entries(masterData).slice(0,5);
      document.getElementById('master-preview').innerHTML = `
        <table class="master-table">
          <thead><tr><th>バーコード</th><th>商品名</th><th>単価</th><th>税率</th><th>割引</th></tr></thead>
          <tbody>${preview.map(([code,p])=>`<tr><td>${code}</td><td>${p.name}</td><td>¥${p.price.toLocaleString()}</td><td>${p.tax}%</td><td>${p.discount}%</td></tr>`).join('')}</tbody>
        </table>
        ${Object.keys(masterData).length>5?`<p style="font-size:11px;color:var(--text-muted);margin-top:4px">...他 ${Object.keys(masterData).length-5} 件</p>`:''}
      `;
      toast('✅ マスターを読み込みました（' + count + '件）');
    } catch(err) {
      toast('❌ 読み込みエラー: ' + err.message);
    }
  };
  if(file.name.endsWith('.csv')) reader.readAsArrayBuffer(file);
  else reader.readAsArrayBuffer(file);
}

// ========== TOAST ==========
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2800);
}
</script>
