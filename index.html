<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>領収書｜メナード北谷美浜店</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root {
  --primary: #c8860a;
  --primary-light: #fdf3e0;
  --primary-dark: #8a5c00;
  --accent: #2d6a4f;
  --bg: #f7f4ef;
  --card: #ffffff;
  --border: #e0d5c5;
  --text: #2c2416;
  --muted: #8a7a60;
  --danger: #c0392b;
  --radius: 14px;
  --shadow: 0 2px 12px rgba(0,0,0,0.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, 'Hiragino Sans', 'Meiryo', sans-serif; background: var(--bg); color: var(--text); font-size: 15px; padding-bottom: 100px; }

/* Header */
.header { background: linear-gradient(135deg, var(--primary-dark), var(--primary)); color: white; padding: 14px 16px 12px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
.header h1 { font-size: 17px; font-weight: 700; }
.header p { font-size: 11px; opacity: 0.85; margin-top: 1px; }

/* Bottom Nav */
.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid var(--border); display: flex; z-index: 200; box-shadow: 0 -2px 12px rgba(0,0,0,0.08); }
.nav-btn { flex: 1; padding: 10px 4px 8px; text-align: center; font-size: 10px; color: var(--muted); cursor: pointer; border: none; background: none; }
.nav-btn.active { color: var(--primary-dark); }
.nav-btn .icon { font-size: 22px; display: block; margin-bottom: 2px; }
.nav-btn.active .icon { transform: scale(1.1); }

/* Pages */
.page { display: none; padding: 12px; }
.page.active { display: block; }

/* Card */
.card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 12px; overflow: hidden; }
.card-head { background: var(--primary-light); padding: 11px 14px; font-weight: 700; font-size: 13px; color: var(--primary-dark); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 6px; }
.card-body { padding: 14px; }

/* Form */
label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 5px; }
input, select { width: 100%; padding: 12px 14px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 16px; color: var(--text); background: white; outline: none; -webkit-appearance: none; }
input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(200,134,10,0.12); }
.form-row { margin-bottom: 12px; }
.form-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.form-grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }

/* Scan */
.scan-box { border: 2.5px dashed var(--primary); border-radius: 12px; padding: 20px; text-align: center; background: var(--primary-light); cursor: pointer; active: opacity:0.8; }
.scan-box:active { opacity: 0.8; }
.scan-icon { font-size: 40px; margin-bottom: 6px; }
#camera-view { display: none; width: 100%; border-radius: 10px; margin-top: 10px; max-height: 240px; object-fit: cover; }
canvas#camera-canvas { display: none; }

/* Tabs */
.tabs { display: flex; background: #f0ebe0; border-radius: 10px; padding: 3px; margin-bottom: 14px; }
.tab { flex: 1; text-align: center; padding: 8px; font-size: 13px; font-weight: 600; border-radius: 8px; cursor: pointer; color: var(--muted); }
.tab.active { background: white; color: var(--primary-dark); box-shadow: 0 1px 4px rgba(0,0,0,0.1); }

/* Items */
.item-row { background: white; border-radius: 10px; border: 1px solid var(--border); padding: 10px 12px; margin-bottom: 8px; position: relative; }
.item-name { font-weight: 600; font-size: 14px; margin-bottom: 6px; padding-right: 28px; }
.item-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.item-price { color: var(--primary-dark); font-weight: 700; font-size: 15px; }
.tax-badge { font-size: 10px; padding: 2px 7px; border-radius: 10px; font-weight: 700; }
.tax-8 { background: #d8f3dc; color: #2d6a4f; }
.tax-10 { background: #e8f0fe; color: #1a56a0; }
.discount-badge { font-size: 11px; color: var(--danger); font-weight: 600; }
.item-del { position: absolute; top: 10px; right: 10px; background: #fee; border: none; color: var(--danger); width: 26px; height: 26px; border-radius: 50%; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.item-controls { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
.item-controls input { padding: 7px 10px; font-size: 14px; text-align: center; }
.qty-ctrl { display: flex; align-items: center; gap: 0; border: 1.5px solid var(--border); border-radius: 8px; overflow: hidden; }
.qty-ctrl button { background: var(--primary-light); border: none; width: 34px; height: 36px; font-size: 18px; color: var(--primary-dark); cursor: pointer; font-weight: 700; }
.qty-ctrl span { width: 38px; text-align: center; font-size: 15px; font-weight: 600; }
.empty-state { text-align: center; color: var(--muted); padding: 30px 20px; font-size: 14px; }

/* Summary */
.summary-card { background: var(--primary-light); border-radius: 12px; padding: 14px; }
.sum-row { display: flex; justify-content: space-between; font-size: 13px; padding: 4px 0; }
.sum-row.discount { color: var(--danger); font-weight: 600; }
.sum-row.total { font-size: 20px; font-weight: 700; color: var(--primary-dark); border-top: 1px solid var(--border); padding-top: 10px; margin-top: 4px; }

/* Buttons */
.btn { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; padding: 14px; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; margin-bottom: 10px; }
.btn:active { opacity: 0.85; transform: scale(0.98); }
.btn-primary { background: var(--primary); color: white; }
.btn-success { background: var(--accent); color: white; }
.btn-outline { background: white; border: 1.5px solid var(--border); color: var(--text); }
.btn-danger { background: #fee; border: 1.5px solid #fcc; color: var(--danger); }
.btn-sm { padding: 9px 14px; font-size: 13px; width: auto; border-radius: 8px; display: inline-flex; }

/* Upload */
.upload-box { border: 2px dashed var(--border); border-radius: 12px; padding: 24px; text-align: center; cursor: pointer; }
.upload-box:active { background: var(--primary-light); }

/* Modal */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 500; overflow-y: auto; padding: 16px; }
.modal { background: white; border-radius: 16px; overflow: hidden; max-width: 480px; margin: 0 auto; }
.modal-head { background: var(--primary); color: white; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 16px; }
.modal-close { background: none; border: none; color: white; font-size: 22px; cursor: pointer; line-height: 1; }
.modal-body { padding: 16px; }

/* Receipt */
.receipt { font-size: 13px; line-height: 1.9; }
.receipt h2 { text-align: center; font-size: 20px; margin-bottom: 4px; }
.receipt .r-center { text-align: center; }
.receipt .r-right { text-align: right; }
.receipt .r-line { border-top: 1px dashed #ccc; margin: 8px 0; }
.receipt .total-box { background: var(--primary-light); border-radius: 10px; padding: 12px; text-align: center; margin: 10px 0; }
.receipt table { width: 100%; font-size: 12px; }
.receipt table td { padding: 3px 4px; vertical-align: top; }

/* Toast */
#toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(20px); background: #222; color: white; padding: 11px 22px; border-radius: 24px; font-size: 13px; font-weight: 600; opacity: 0; transition: all 0.3s; pointer-events: none; z-index: 9999; white-space: nowrap; }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.badge-count { background: var(--danger); color: white; border-radius: 50%; width: 18px; height: 18px; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; position: absolute; top: 6px; right: 12px; }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <h1>🌸 メナード北谷美浜店</h1>
  <p>領収書発行システム</p>
</div>

<!-- Page: スキャン -->
<div class="page active" id="page-scan">
  <div class="card">
    <div class="card-head">📦 商品追加</div>
    <div class="card-body">
      <div class="tabs">
        <div class="tab active" onclick="switchTab('scan')">📷 スキャン</div>
        <div class="tab" onclick="switchTab('manual')">✏️ 手入力</div>
      </div>

      <!-- スキャン -->
      <div id="tab-scan">
        <div class="form-row">
          <label>処理番号・バーコード入力</label>
          <input type="text" id="barcode-input" placeholder="番号を入力してEnter" inputmode="numeric" style="font-size:18px;letter-spacing:2px;text-align:center">
        </div>
        <button class="btn btn-outline" onclick="triggerScan()" style="margin-bottom:0">
          <span id="cam-icon">📷</span> <span id="cam-text">カメラでスキャン</span>
        </button>
        <video id="camera-view" autoplay playsinline></video>
        <canvas id="camera-canvas"></canvas>
        <div id="scan-status" style="text-align:center;font-size:12px;color:var(--muted);margin-top:6px"></div>
      </div>

      <!-- 手入力 -->
      <div id="tab-manual" style="display:none">
        <div class="form-row">
          <label>商品名</label>
          <input type="text" id="m-name" placeholder="商品名を入力">
        </div>
        <div class="form-grid2">
          <div class="form-row">
            <label>単価（税抜）</label>
            <input type="number" id="m-price" placeholder="0" inputmode="numeric">
          </div>
          <div class="form-row">
            <label>数量</label>
            <input type="number" id="m-qty" value="1" min="1" inputmode="numeric">
          </div>
        </div>
        <div class="form-grid2">
          <div class="form-row">
            <label>税率</label>
            <select id="m-tax">
              <option value="10">10%（標準）</option>
              <option value="8">8%（軽減）</option>
            </select>
          </div>
          <div class="form-row">
            <label>割引率（%）</label>
            <input type="number" id="m-discount" value="0" min="0" max="100" inputmode="numeric">
          </div>
        </div>
        <button class="btn btn-primary" onclick="addManualItem()">＋ 追加</button>
      </div>
    </div>
  </div>

  <!-- Items -->
  <div class="card">
    <div class="card-head">
      🛍️ 明細
      <button class="btn-sm btn-danger" style="margin-left:auto" onclick="clearItems()">🗑 クリア</button>
    </div>
    <div class="card-body" id="items-list">
      <div class="empty-state">商品を追加してください</div>
    </div>
  </div>
</div>

<!-- Page: 領収書 -->
<div class="page" id="page-receipt">
  <div class="card">
    <div class="card-head">👤 宛名・日付</div>
    <div class="card-body">
      <div class="form-row">
        <label>宛名</label>
        <input type="text" id="recipient" placeholder="〇〇　様">
      </div>
      <div class="form-row">
        <label>但し書き</label>
        <input type="text" id="purpose" value="化粧品代として">
      </div>
      <div class="form-grid2">
        <div class="form-row">
          <label>発行日</label>
          <input type="date" id="issue-date">
        </div>
        <div class="form-row">
          <label>領収書番号</label>
          <input type="text" id="receipt-no">
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-head">💰 金額</div>
    <div class="card-body">
      <div class="summary-card">
        <div class="sum-row"><span>小計（税抜）</span><span id="s-subtotal">¥0</span></div>
        <div class="sum-row discount"><span>値引き</span><span id="s-discount">-¥0</span></div>
        <div class="sum-row"><span>消費税 8%対象</span><span id="s-tax8base">¥0</span></div>
        <div class="sum-row"><span>　うち消費税8%</span><span id="s-tax8">¥0</span></div>
        <div class="sum-row"><span>消費税10%対象</span><span id="s-tax10base">¥0</span></div>
        <div class="sum-row"><span>　うち消費税10%</span><span id="s-tax10">¥0</span></div>
        <div class="sum-row total"><span>合計（税込）</span><span id="s-total">¥0</span></div>
      </div>
    </div>
  </div>

  <button class="btn btn-primary" onclick="showPreview()">👁 プレビュー確認</button>
  <button class="btn btn-success" onclick="exportExcel()">📥 Excel出力</button>
</div>

<!-- Page: マスター -->
<div class="page" id="page-master">
  <div class="card">
    <div class="card-head">📂 商品マスター</div>
    <div class="card-body">
      <p style="font-size:13px;color:var(--muted);margin-bottom:14px">menard_master.xlsxをアップロードすると処理番号から自動入力できます</p>
      <div class="upload-box" onclick="document.getElementById('master-file').click()">
        <div style="font-size:36px;margin-bottom:8px">📤</div>
        <div style="font-weight:700;margin-bottom:4px">Excel / CSV をアップロード</div>
        <div style="font-size:12px;color:var(--muted)">タップして選択</div>
      </div>
      <input type="file" id="master-file" accept=".xlsx,.xls,.csv" style="display:none" onchange="loadMaster(event)">
      <div id="master-status" style="margin-top:12px;font-size:13px;color:var(--muted)"></div>
      <div id="master-count" style="margin-top:8px"></div>
    </div>
  </div>
</div>

<!-- Preview Modal -->
<div class="modal-overlay" id="preview-modal">
  <div class="modal">
    <div class="modal-head">
      領収書プレビュー
      <button class="modal-close" onclick="closePreview()">✕</button>
    </div>
    <div class="modal-body">
      <div class="receipt" id="receipt-content"></div>
      <div style="margin-top:16px">
        <button class="btn btn-success" onclick="exportExcel();closePreview()">📥 Excel出力</button>
        <button class="btn btn-outline" onclick="closePreview()">閉じる</button>
      </div>
    </div>
  </div>
</div>

<!-- Bottom Nav -->
<nav class="bottom-nav">
  <button class="nav-btn active" id="nav-scan" onclick="showPage('scan')">
    <span class="icon">📷</span>スキャン
  </button>
  <button class="nav-btn" id="nav-receipt" onclick="showPage('receipt')" style="position:relative">
    <span class="icon">🧾</span>領収書
    <span class="badge-count" id="item-count" style="display:none">0</span>
  </button>
  <button class="nav-btn" id="nav-master" onclick="showPage('master')">
    <span class="icon">📂</span>マスター
  </button>
</nav>

<div id="toast"></div>

<script>
// ========== STATE ==========
let items = [];
let masterData = {};
let cameraActive = false;
let scanInterval = null;

// ========== INIT ==========
document.addEventListener('DOMContentLoaded', () => {
  const today = new Date();
  document.getElementById('issue-date').value = today.toISOString().split('T')[0];
  document.getElementById('receipt-no').value = 'R' + today.getFullYear() + String(today.getMonth()+1).padStart(2,'0') + String(today.getDate()).padStart(2,'0') + '-' + String(Math.floor(Math.random()*1000)).padStart(3,'0');
  document.getElementById('barcode-input').addEventListener('keydown', e => { if(e.key==='Enter') scanBarcode(); });
});

// ========== NAVIGATION ==========
function showPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  document.getElementById('nav-'+name).classList.add('active');
  if(name !== 'scan') stopCamera();
  if(name === 'receipt') updateSummary();
}

// ========== TABS ==========
function switchTab(name) {
  document.querySelectorAll('.tabs .tab').forEach((t,i)=>t.classList.toggle('active',['scan','manual'][i]===name));
  document.getElementById('tab-scan').style.display = name==='scan'?'block':'none';
  document.getElementById('tab-manual').style.display = name==='manual'?'block':'none';
  if(name==='scan') setTimeout(()=>document.getElementById('barcode-input').focus(),100);
}

// ========== SCAN ==========
function scanBarcode() {
  const code = document.getElementById('barcode-input').value.trim();
  if(!code) return;
  const product = masterData[code];
  if(product) {
    addItem(product.name, product.price, 1, product.tax||10, product.discount||0, code);
    toast('✅ ' + product.name);
  } else {
    switchTab('manual');
    document.getElementById('m-name').value = '';
    toast('⚠️ 未登録。手入力してください（番号: '+code+'）');
  }
  document.getElementById('barcode-input').value = '';
}

async function triggerScan() {
  if(cameraActive) { stopCamera(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    const video = document.getElementById('camera-view');
    video.srcObject = stream;
    video.style.display = 'block';
    document.getElementById('cam-icon').textContent = '⏹';
    document.getElementById('cam-text').textContent = 'カメラ停止';
    document.getElementById('scan-status').textContent = 'バーコードを画面に向けてください';
    cameraActive = true;
    if('BarcodeDetector' in window) {
      const detector = new BarcodeDetector({ formats: ['ean_13','ean_8','code_128','code_39','qr_code'] });
      scanInterval = setInterval(async () => {
        if(!cameraActive) return;
        try {
          const codes = await detector.detect(video);
          if(codes.length > 0) {
            document.getElementById('barcode-input').value = codes[0].rawValue;
            stopCamera();
            scanBarcode();
          }
        } catch(e){}
      }, 500);
    } else {
      document.getElementById('scan-status').textContent = 'このブラウザはカメラスキャン非対応。番号を手入力してください。';
    }
  } catch(e) {
    toast('❌ カメラにアクセスできません');
  }
}

function stopCamera() {
  const video = document.getElementById('camera-view');
  if(video.srcObject) video.srcObject.getTracks().forEach(t=>t.stop());
  video.style.display = 'none';
  clearInterval(scanInterval);
  cameraActive = false;
  document.getElementById('cam-icon').textContent = '📷';
  document.getElementById('cam-text').textContent = 'カメラでスキャン';
  document.getElementById('scan-status').textContent = '';
}

// ========== ITEMS ==========
function addItem(name, price, qty, tax, discount, barcode='') {
  items.push({ name, price: parseFloat(price)||0, qty: parseInt(qty)||1, tax: parseInt(tax)||10, discount: parseFloat(discount)||0, barcode });
  renderItems();
  updateBadge();
}

function addManualItem() {
  const name = document.getElementById('m-name').value.trim();
  const price = document.getElementById('m-price').value;
  const qty = document.getElementById('m-qty').value;
  const tax = document.getElementById('m-tax').value;
  const discount = document.getElementById('m-discount').value;
  if(!name) { toast('⚠️ 商品名を入力してください'); return; }
  if(!price) { toast('⚠️ 単価を入力してください'); return; }
  addItem(name, price, qty, tax, discount);
  document.getElementById('m-name').value='';
  document.getElementById('m-price').value='';
  document.getElementById('m-qty').value='1';
  document.getElementById('m-discount').value='0';
  toast('✅ 追加しました');
}

function changeQty(idx, delta) {
  items[idx].qty = Math.max(1, items[idx].qty + delta);
  renderItems();
  updateBadge();
}

function removeItem(idx) {
  items.splice(idx, 1);
  renderItems();
  updateBadge();
}

function clearItems() {
  if(items.length === 0) return;
  if(confirm('明細をすべてクリアしますか？')) { items=[]; renderItems(); updateBadge(); }
}

function renderItems() {
  const el = document.getElementById('items-list');
  if(items.length === 0) { el.innerHTML = '<div class="empty-state">商品を追加してください</div>'; return; }
  el.innerHTML = items.map((item, i) => {
    const subtotal = Math.floor(item.price * (1 - item.discount/100) * item.qty);
    return `<div class="item-row">
      <div class="item-name">${item.name}</div>
      <div class="item-meta">
        <span class="item-price">¥${subtotal.toLocaleString()}</span>
        <span class="tax-badge tax-${item.tax}">${item.tax}%</span>
        ${item.discount>0?`<span class="discount-badge">-${item.discount}%割引</span>`:''}
      </div>
      <div class="item-controls">
        <div class="qty-ctrl">
          <button onclick="changeQty(${i},-1)">−</button>
          <span>${item.qty}</span>
          <button onclick="changeQty(${i},1)">＋</button>
        </div>
        <span style="font-size:12px;color:var(--muted)">単価¥${item.price.toLocaleString()}</span>
      </div>
      <button class="item-del" onclick="removeItem(${i})">✕</button>
    </div>`;
  }).join('');
}

function updateBadge() {
  const badge = document.getElementById('item-count');
  if(items.length > 0) { badge.style.display='flex'; badge.textContent=items.length; }
  else badge.style.display='none';
}

// ========== CALC ==========
function calcTotals() {
  let subtotal=0, totalDiscount=0, base8=0, base10=0;
  items.forEach(item => {
    const orig = item.price * item.qty;
    const disc = orig * (item.discount/100);
    const after = orig - disc;
    subtotal += orig;
    totalDiscount += disc;
    if(item.tax===8) base8 += after;
    else base10 += after;
  });
  const tax8 = Math.floor(base8 * 0.08);
  const tax10 = Math.floor(base10 * 0.10);
  const total = Math.floor(base8 + base10) + tax8 + tax10;
  return { subtotal, totalDiscount, base8, base10, tax8, tax10, total };
}

function updateSummary() {
  const c = calcTotals();
  document.getElementById('s-subtotal').textContent = '¥' + Math.floor(c.subtotal).toLocaleString();
  document.getElementById('s-discount').textContent = '-¥' + Math.floor(c.totalDiscount).toLocaleString();
  document.getElementById('s-tax8base').textContent = '¥' + Math.floor(c.base8).toLocaleString();
  document.getElementById('s-tax8').textContent = '¥' + c.tax8.toLocaleString();
  document.getElementById('s-tax10base').textContent = '¥' + Math.floor(c.base10).toLocaleString();
  document.getElementById('s-tax10').textContent = '¥' + c.tax10.toLocaleString();
  document.getElementById('s-total').textContent = '¥' + c.total.toLocaleString();
}

// ========== PREVIEW ==========
function showPreview() {
  if(items.length===0){ toast('⚠️ 商品を追加してください'); showPage('scan'); return; }
  const c = calcTotals();
  const recipient = document.getElementById('recipient').value || '　　　　　';
  const purpose = document.getElementById('purpose').value;
  const date = document.getElementById('issue-date').value;
  const rno = document.getElementById('receipt-no').value;
  const rows = items.map(item => {
    const after = Math.floor(item.price*(1-item.discount/100)*item.qty);
    return `<tr><td>${item.name}${item.discount>0?` <span style="color:var(--danger);font-size:10px">(-${item.discount}%)</span>`:''}</td><td style="text-align:right">×${item.qty}</td><td style="text-align:right">¥${after.toLocaleString()}<span class="tax-badge tax-${item.tax}" style="margin-left:3px">${item.tax}%</span></td></tr>`;
  }).join('');
  document.getElementById('receipt-content').innerHTML = `
    <h2>領 収 書</h2>
    <p class="r-center" style="font-size:11px;color:var(--muted)">${rno}</p>
    <div class="r-line"></div>
    <p style="font-size:15px;margin:8px 0;font-weight:600">${recipient} 様</p>
    <div class="total-box">
      <div style="font-size:11px;color:var(--muted)">合計金額（税込）</div>
      <div style="font-size:30px;font-weight:700;color:var(--primary-dark)">¥${c.total.toLocaleString()}</div>
    </div>
    <p style="margin-bottom:10px">但し：${purpose}</p>
    <div class="r-line"></div>
    <table>${rows}</table>
    <div class="r-line"></div>
    <table style="font-size:11px">
      <tr><td>小計（税抜）</td><td style="text-align:right">¥${Math.floor(c.subtotal).toLocaleString()}</td></tr>
      ${c.totalDiscount>0?`<tr><td style="color:var(--danger)">値引き</td><td style="text-align:right;color:var(--danger)">-¥${Math.floor(c.totalDiscount).toLocaleString()}</td></tr>`:''}
      <tr><td>8%対象（税抜）</td><td style="text-align:right">¥${Math.floor(c.base8).toLocaleString()}</td></tr>
      <tr><td>　消費税8%</td><td style="text-align:right">¥${c.tax8.toLocaleString()}</td></tr>
      <tr><td>10%対象（税抜）</td><td style="text-align:right">¥${Math.floor(c.base10).toLocaleString()}</td></tr>
      <tr><td>　消費税10%</td><td style="text-align:right">¥${c.tax10.toLocaleString()}</td></tr>
    </table>
    <div class="r-line"></div>
    <p class="r-right" style="font-size:11px;color:var(--muted)">${date}</p>
    <p class="r-center" style="margin-top:8px;font-weight:700;font-size:14px">メナード北谷美浜店</p>
  `;
  document.getElementById('preview-modal').style.display = 'block';
}

function closePreview() { document.getElementById('preview-modal').style.display = 'none'; }

// ========== EXCEL ==========
function exportExcel() {
  if(items.length===0){ toast('⚠️ 商品を追加してください'); return; }
  const c = calcTotals();
  const recipient = document.getElementById('recipient').value;
  const purpose = document.getElementById('purpose').value;
  const date = document.getElementById('issue-date').value;
  const rno = document.getElementById('receipt-no').value;
  const wb = XLSX.utils.book_new();
  const ws_data = [
    ['領収書'], [''],
    ['領収書番号', rno], ['発行日', date], [''],
    ['宛名', recipient + ' 様'], ['但し書き', purpose], [''],
    ['商品名','単価（税抜）','数量','割引率','税率','小計（税抜）'],
    ...items.map(item=>[item.name, item.price, item.qty, item.discount+'%', item.tax+'%', Math.floor(item.price*(1-item.discount/100)*item.qty)]),
    [''],
    ['小計（税抜）','','','','',Math.floor(c.subtotal)],
    ['値引き合計','','','','',-Math.floor(c.totalDiscount)],
    ['8%対象（税抜）','','','','',Math.floor(c.base8)],
    ['消費税8%','','','','',c.tax8],
    ['10%対象（税抜）','','','','',Math.floor(c.base10)],
    ['消費税10%','','','','',c.tax10],
    ['合計（税込）','','','','',c.total],
    [''], ['発行者','メナード北谷美浜店'],
  ];
  const ws = XLSX.utils.aoa_to_sheet(ws_data);
  ws['!cols'] = [{wch:28},{wch:14},{wch:8},{wch:10},{wch:8},{wch:14}];
  XLSX.utils.book_append_sheet(wb, ws, '領収書');
  XLSX.writeFile(wb, `領収書_${rno}_${date}.xlsx`);
  toast('📥 ダウンロードしました');
}

// ========== MASTER ==========
function loadMaster(event) {
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const wb = XLSX.read(e.target.result, {type:'array'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {header:1});
      masterData = {};
      const header = rows[0].map(h=>(h||'').toString().toLowerCase());
      const cB = header.findIndex(h=>h.includes('バーコード')||h.includes('処理番号')||h.includes('barcode')||h.includes('jan'));
      const cN = header.findIndex(h=>h.includes('商品名')||h.includes('name'));
      const cP = header.findIndex(h=>h.includes('単価')||h.includes('price')||h.includes('税抜'));
      const cT = header.findIndex(h=>h.includes('税率')||h.includes('tax'));
      const cD = header.findIndex(h=>h.includes('割引')||h.includes('discount'));
      let count = 0;
      rows.slice(1).forEach(row => {
        if(!row[cB]||!row[cN]) return;
        const code = String(row[cB]).trim();
        masterData[code] = { name: row[cN]||'', price: parseFloat(row[cP])||0, tax: parseInt(row[cT])||10, discount: parseFloat(row[cD])||0 };
        count++;
      });
      document.getElementById('master-status').innerHTML = `<span style="color:var(--accent);font-weight:600">✅ ${count}件の商品を読み込みました</span>`;
      document.getElementById('master-count').innerHTML = `<p style="font-size:12px;color:var(--muted)">処理番号を入力するだけで商品が自動入力されます</p>`;
      toast('✅ マスター読み込み完了（' + count + '件）');
    } catch(err) { toast('❌ 読み込みエラー: ' + err.message); }
  };
  reader.readAsArrayBuffer(file);
}

// ========== TOAST ==========
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2500);
}
