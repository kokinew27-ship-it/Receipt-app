<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>領収書｜メナード北谷美浜店</title>
<script>
// Chromeで開かれた場合、SafariのURLスキームで開き直す
(function(){
  var ua = navigator.userAgent;
  var isIOS = /iP(hone|od|ad)/.test(ua);
  var isChrome = /CriOS/.test(ua);
  if(isIOS && isChrome){
    var url = window.location.href;
    window.location.href = 'safari-https://' + url.replace(/^https?:\/\//, '');
  }
})();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--p:#c8860a;--pl:#fdf3e0;--pd:#8a5c00;--ac:#2d6a4f;--bg:#f7f4ef;--card:#fff;--bd:#e0d5c5;--tx:#2c2416;--mu:#8a7a60;--red:#c0392b;--r:14px;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,'Hiragino Sans',sans-serif;background:var(--bg);color:var(--tx);font-size:15px;padding-bottom:90px;}
.header{background:linear-gradient(135deg,#8a5c00,#c8860a);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.2);}
.header h1{font-size:17px;font-weight:700;}
.header p{font-size:11px;opacity:.85;margin-top:1px;}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--bd);display:flex;z-index:200;box-shadow:0 -2px 12px rgba(0,0,0,.08);}
.nav-btn{flex:1;padding:10px 4px 8px;text-align:center;font-size:10px;color:var(--mu);cursor:pointer;border:none;background:none;position:relative;}
.nav-btn.active{color:var(--pd);}
.nav-btn .icon{font-size:22px;display:block;margin-bottom:2px;}
.page{display:none;padding:12px;}
.page.active{display:block;}
.card{background:var(--card);border-radius:var(--r);box-shadow:0 2px 12px rgba(0,0,0,.08);margin-bottom:12px;overflow:hidden;}
.card-head{background:var(--pl);padding:11px 14px;font-weight:700;font-size:13px;color:var(--pd);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:6px;}
.card-body{padding:14px;}
label{display:block;font-size:12px;font-weight:600;color:var(--mu);margin-bottom:5px;}
input,select{width:100%;padding:11px 13px;border:1.5px solid var(--bd);border-radius:10px;font-size:16px;color:var(--tx);background:#fff;outline:none;-webkit-appearance:none;}
input:focus,select:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(200,134,10,.12);}
.form-row{margin-bottom:11px;}
.form-grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.form-grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}

/* スキャン後編集パネル */
.edit-panel{background:var(--pl);border:2px solid var(--p);border-radius:12px;padding:14px;margin-bottom:12px;display:none;}
.edit-panel.show{display:block;}
.edit-panel-title{font-weight:700;color:var(--pd);font-size:14px;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.edit-field{margin-bottom:10px;}
.edit-field label{font-size:12px;font-weight:600;color:var(--mu);margin-bottom:4px;}
.edit-field input,.edit-field select{padding:10px 12px;font-size:15px;}

/* 直接入力チェック */
.direct-check{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--bd);border-radius:10px;padding:11px 13px;margin-bottom:10px;cursor:pointer;}
.direct-check input[type=checkbox]{width:20px;height:20px;cursor:pointer;accent-color:var(--p);}
.direct-check-label{font-size:14px;font-weight:600;color:var(--tx);}
.direct-price-row{display:none;margin-bottom:10px;}
.direct-price-row.show{display:block;}
.direct-price-row input{font-size:20px;font-weight:700;color:var(--pd);text-align:center;background:var(--pl);}

/* 税率バッジ */
.tax-badge{font-size:11px;padding:3px 8px;border-radius:10px;font-weight:700;display:inline-block;}
.tax-8{background:#d8f3dc;color:#2d6a4f;}
.tax-10{background:#e8f0fe;color:#1a56a0;}
.food-badge{font-size:10px;padding:2px 6px;border-radius:8px;background:#fff3cd;color:#856404;font-weight:700;}

/* 商品リスト */
.item-row{background:#fff;border-radius:10px;border:1px solid var(--bd);padding:11px 12px;margin-bottom:8px;position:relative;}
.item-name{font-weight:600;font-size:14px;margin-bottom:5px;padding-right:30px;}
.item-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px;}
.item-price{color:var(--pd);font-weight:700;font-size:15px;}
.disc-badge{font-size:11px;color:var(--red);font-weight:600;}
.item-del{position:absolute;top:10px;right:10px;background:#fee;border:none;color:var(--red);width:28px;height:28px;border-radius:50%;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.qty-ctrl{display:flex;align-items:center;border:1.5px solid var(--bd);border-radius:8px;overflow:hidden;}
.qty-ctrl button{background:var(--pl);border:none;width:34px;height:34px;font-size:18px;color:var(--pd);cursor:pointer;font-weight:700;}
.qty-ctrl span{width:36px;text-align:center;font-size:14px;font-weight:600;}

/* サジェスト */
.suggest-list{background:#fff;border:1.5px solid var(--p);border-radius:10px;margin-top:6px;max-height:220px;overflow-y:auto;box-shadow:0 4px 12px rgba(0,0,0,.1);}
.suggest-item{padding:11px 14px;border-bottom:1px solid var(--bd);cursor:pointer;}
.suggest-item:last-child{border-bottom:none;}
.suggest-item:active{background:var(--pl);}
.suggest-name{font-size:14px;font-weight:600;}
.suggest-meta{font-size:11px;color:var(--mu);margin-top:2px;display:flex;gap:8px;}

/* カメラ */
.camera-wrap{border-radius:12px;overflow:hidden;background:#000;margin-bottom:10px;display:none;position:relative;}
#camera-view{width:100%;display:block;max-height:260px;object-fit:cover;}
.camera-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;}
.scan-frame{width:220px;height:110px;border:3px solid rgba(200,134,10,.95);border-radius:8px;box-shadow:0 0 0 2000px rgba(0,0,0,.4);}
.scan-hint{color:#fff;font-size:12px;margin-top:10px;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.8);}
.capture-btn-wrap{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);}
.capture-btn{width:64px;height:64px;border-radius:50%;background:#fff;border:4px solid var(--p);font-size:26px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.3);}
.capture-btn:active{transform:scale(.9);}

/* ボタン */
.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:14px;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;margin-bottom:10px;}
.btn:active{opacity:.85;transform:scale(.98);}
.btn-primary{background:var(--p);color:#fff;}
.btn-success{background:var(--ac);color:#fff;}
.btn-outline{background:#fff;border:1.5px solid var(--bd);color:var(--tx);}
.btn-cam{background:var(--pd);color:#fff;}
.btn-add{background:var(--p);color:#fff;border:none;border-radius:10px;padding:0 18px;font-size:22px;font-weight:700;cursor:pointer;height:46px;white-space:nowrap;}
.btn-sm{padding:8px 14px;font-size:13px;width:auto;border-radius:8px;display:inline-flex;}
.btn-danger-sm{background:#fee;border:1.5px solid #fcc;color:var(--red);padding:8px 14px;font-size:13px;width:auto;border-radius:8px;display:inline-flex;cursor:pointer;font-weight:600;border-style:solid;}

/* サマリー */
.summary-card{background:var(--pl);border-radius:12px;padding:14px;}
.sum-row{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;}
.sum-row.discount{color:var(--red);font-weight:600;}
.sum-row.total{font-size:20px;font-weight:700;color:var(--pd);border-top:1px solid var(--bd);padding-top:10px;margin-top:4px;}

/* モーダル */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:500;overflow-y:auto;padding:16px;}
.modal{background:#fff;border-radius:16px;overflow:hidden;max-width:480px;margin:0 auto;}
.modal-head{background:var(--p);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:16px;}
.modal-close{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;}
.modal-body{padding:16px;}
.receipt{font-size:13px;line-height:1.9;}
.receipt h2{text-align:center;font-size:20px;margin-bottom:4px;}
.r-center{text-align:center;}
.r-right{text-align:right;}
.r-line{border-top:1px dashed #ccc;margin:8px 0;}
.total-box{background:var(--pl);border-radius:10px;padding:12px;text-align:center;margin:10px 0;}
.receipt table{width:100%;font-size:12px;}
.receipt table td{padding:3px 4px;vertical-align:top;}

.empty-state{text-align:center;color:var(--mu);padding:28px 20px;font-size:14px;}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:#222;color:#fff;padding:11px 22px;border-radius:24px;font-size:13px;font-weight:600;opacity:0;transition:all .3s;pointer-events:none;z-index:9999;white-space:nowrap;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.badge-count{background:var(--red);color:#fff;border-radius:50%;width:18px;height:18px;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;position:absolute;top:6px;right:12px;}
</style>
</head>
<body>

<div class="header">
  <h1>🌸 メナード北谷美浜店</h1>
  <p>領収書発行システム</p>
</div>

<!-- スキャンページ -->
<div class="page active" id="page-scan">

  <!-- 入力欄 -->
  <div class="card">
    <div class="card-head">📦 商品スキャン・入力</div>
    <div class="card-body">
      <div class="form-row">
        <label>処理番号を入力</label>
        <div style="display:flex;gap:8px">
          <input type="tel" id="barcode-input" placeholder="例：711609" maxlength="10" style="flex:1;font-size:18px;text-align:center;letter-spacing:2px" oninput="onCodeInput(this.value)">
          <button class="btn-add" onclick="searchByCode()">検索</button>
        </div>
        <div id="suggest-box"></div>
      </div>
      <button class="btn btn-cam" onclick="toggleCamera()" style="margin-bottom:0">
        <span id="cam-icon">📷</span><span id="cam-text">カメラを起動</span>
      </button>
      <div class="camera-wrap" id="camera-wrap">
        <video id="camera-view" autoplay playsinline muted></video>
        <div class="camera-overlay">
          <div class="scan-frame"></div>
          <div class="scan-hint">バーコードを枠に合わせて📸ボタンを押す</div>
        </div>
        <div class="capture-btn-wrap">
          <button class="capture-btn" onclick="captureAndScan()">📸</button>
        </div>
      </div>
      <canvas id="camera-canvas" style="display:none"></canvas>
      <div id="scan-status" style="text-align:center;font-size:12px;color:var(--mu);margin-top:6px"></div>
    </div>
  </div>

  <!-- スキャン後編集パネル -->
  <div class="edit-panel" id="edit-panel">
    <div class="edit-panel-title">✏️ 内容を確認・編集してから追加</div>

    <!-- 直接入力チェック -->
    <div class="direct-check" onclick="toggleDirect()">
      <input type="checkbox" id="direct-chk" onclick="event.stopPropagation();toggleDirect()">
      <span class="direct-check-label">💴 金額を直接入力する</span>
    </div>
    <div class="direct-price-row" id="direct-price-row">
      <label>税込金額を直接入力（円）</label>
      <input type="tel" id="direct-price" placeholder="0" style="font-size:24px;font-weight:700;text-align:center;background:var(--pl)">
    </div>

    <div id="normal-fields">
      <div class="edit-field">
        <label>商品名</label>
        <input type="text" id="e-name" placeholder="商品名">
      </div>
      <div class="form-grid2">
        <div class="edit-field">
          <label>単価（税抜）</label>
          <input type="tel" id="e-price" placeholder="0" inputmode="decimal">
        </div>
        <div class="edit-field">
          <label>数量</label>
          <input type="tel" id="e-qty" value="1" min="1">
        </div>
      </div>
      <div class="form-grid2">
        <div class="edit-field">
          <label>消費税率</label>
          <select id="e-tax">
            <option value="10">10%（標準）</option>
            <option value="8">8%（飲食・軽減）</option>
          </select>
        </div>
        <div class="edit-field">
          <label>割引率（%）</label>
          <input type="tel" id="e-discount" value="0" placeholder="0">
        </div>
      </div>
    </div>

    <div id="edit-preview" style="background:#fff;border-radius:8px;padding:10px;margin-bottom:10px;font-size:13px;color:var(--mu)"></div>

    <button class="btn btn-primary" onclick="addFromPanel()">＋ 明細に追加</button>
    <button class="btn btn-outline" onclick="closePanel()" style="margin-bottom:0">キャンセル</button>
  </div>

  <!-- 明細リスト -->
  <div class="card">
    <div class="card-head">
      🛍️ 明細
      <button class="btn-danger-sm" style="margin-left:auto" onclick="clearItems()">🗑 クリア</button>
    </div>
    <div class="card-body" id="items-list">
      <div class="empty-state">商品を追加してください</div>
    </div>
  </div>
</div>

<!-- 領収書ページ -->
<div class="page" id="page-receipt">
  <div class="card">
    <div class="card-head">👤 担当者・宛名・日付</div>
    <div class="card-body">
      <div class="form-row">
        <label>担当者</label>
        <select id="staff-select">
          <option value="長嶺">０ 長嶺</option>
          <option value="澤岻">１ 澤岻</option>
          <option value="山城">２ 山城</option>
          <option value="又吉">３ 又吉</option>
          <option value="德元">４ 德元</option>
          <option value="その他">５ その他</option>
        </select>
      </div>
      <div class="form-row">
        <label>宛名</label>
        <input type="text" id="recipient" placeholder="〇〇　様">
      </div>
      <div class="form-row">
        <label>但し書き</label>
        <input type="text" id="purpose" value="化粧品代として">
      </div>
      <div class="form-grid2">
        <div class="form-row">
          <label>発行日</label>
          <input type="date" id="issue-date">
        </div>
        <div class="form-row">
          <label>領収書番号</label>
          <input type="text" id="receipt-no">
        </div>
      </div>
    </div>
  </div>
  <div class="card">
    <div class="card-head">💰 金額サマリー</div>
    <div class="card-body">
      <div class="summary-card">
        <div class="sum-row"><span>小計（税抜）</span><span id="s-subtotal">¥0</span></div>
        <div class="sum-row discount"><span>値引き</span><span id="s-discount">-¥0</span></div>
        <div class="sum-row"><span>8%対象（税抜）</span><span id="s-tax8base">¥0</span></div>
        <div class="sum-row"><span>　消費税8%</span><span id="s-tax8">¥0</span></div>
        <div class="sum-row"><span>10%対象（税抜）</span><span id="s-tax10base">¥0</span></div>
        <div class="sum-row"><span>　消費税10%</span><span id="s-tax10">¥0</span></div>
        <div class="sum-row total"><span>合計（税込）</span><span id="s-total">¥0</span></div>
      </div>
    </div>
  </div>
  <button class="btn btn-primary" onclick="showPreview()">👁 プレビュー確認</button>
  <button class="btn btn-success" onclick="exportExcel()">📥 Excel出力</button>
</div>


<!-- 日計表ページ -->
<div class="page" id="page-daily">
  <div class="card">
    <div class="card-head">📊 本日の日計表</div>
    <div class="card-body">
      <div id="daily-summary" style="font-size:14px;color:var(--mu);text-align:center;padding:20px">
        領収書を発行すると日計が表示されます
      </div>
    </div>
  </div>
  <div class="card">
    <div class="card-head">🧾 本日の発行一覧</div>
    <div class="card-body" id="daily-list">
      <div class="empty-state">まだ発行がありません</div>
    </div>
  </div>
  <button class="btn btn-success" onclick="exportDailyExcel()">📥 日計表をExcel出力</button>
  <button class="btn btn-danger-sm" style="width:100%;justify-content:center;margin-bottom:10px" onclick="clearDaily()">🗑 日計をリセット</button>
</div>

<!-- プレビューモーダル -->
<div class="modal-overlay" id="preview-modal">
  <div class="modal">
    <div class="modal-head">領収書プレビュー
      <button class="modal-close" onclick="closePreview()">✕</button>
    </div>
    <div class="modal-body">
      <div class="receipt" id="receipt-content"></div>
      <div style="margin-top:16px">
        <button class="btn btn-success" onclick="exportExcel();closePreview()">📥 Excel出力</button>
        <button class="btn btn-outline" onclick="closePreview()">閉じる</button>
      </div>
    </div>
  </div>
</div>

<nav class="bottom-nav">
  <button class="nav-btn active" id="nav-scan" onclick="showPage('scan')">
    <span class="icon">📷</span>スキャン
  </button>
  <button class="nav-btn" id="nav-receipt" onclick="showPage('receipt')" style="position:relative">
    <span class="icon">🧾</span>領収書
    <span class="badge-count" id="item-count" style="display:none">0</span>
  </button>
  <button class="nav-btn" id="nav-daily" onclick="showPage('daily')">
    <span class="icon">📊</span>日計表
  </button>
</nav>

<div id="toast"></div>

// ========== INIT ==========
document.addEventListener('DOMContentLoaded', () => {
  const today = new Date();
  document.getElementById('issue-date').value = today.toISOString().split('T')[0];
  document.getElementById('receipt-no').value = 'R' + today.getFullYear() + String(today.getMonth()+1).padStart(2,'0') + String(today.getDate()).padStart(2,'0') + '-' + String(Math.floor(Math.random()*1000)).padStart(3,'0');
  // 編集パネルの変更をリアルタイムでプレビュー
  ['e-name','e-price','e-qty','e-tax','e-discount','direct-price'].forEach(id => {
    document.getElementById(id).addEventListener('input', updateEditPreview);
  });
  document.getElementById('e-tax').addEventListener('change', updateEditPreview);
});

// ========== NAVIGATION ==========
function showPage(name) {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  document.getElementById('nav-'+name).classList.add('active');
  if(name!=='scan') stopCamera();
  if(name==='receipt') updateSummary();
  if(name==='daily') renderDaily();
}

// ========== サジェスト ==========
function onCodeInput(val) {
  const box = document.getElementById('suggest-box');
  if(val.length < 2) { box.innerHTML=''; return; }
  const matches = Object.entries(MASTER).filter(([code])=>code.startsWith(val)).slice(0,6);
  if(!matches.length) { box.innerHTML=''; return; }
  box.innerHTML = `<div class="suggest-list">${matches.map(([code,p])=>`
    <div class="suggest-item" onclick="selectCode('${code}')">
      <div class="suggest-name">${p.name}${p.food?` <span class="food-badge">🍵飲食</span>`:''}</div>
      <div class="suggest-meta">
        <span>${code}</span>
        <span>¥${p.price.toLocaleString()}</span>
        <span class="tax-badge tax-${p.tax}">${p.tax}%</span>
      </div>
    </div>`).join('')}</div>`;
}

function selectCode(code) {
  document.getElementById('barcode-input').value = code;
  document.getElementById('suggest-box').innerHTML = '';
  searchByCode();
}

// ========== 検索→編集パネル ==========
function searchByCode() {
  const code = document.getElementById('barcode-input').value.trim();
  if(!code) return;
  const product = MASTER[code];
  openEditPanel(
    product ? product.name : '',
    product ? product.price : 0,
    product ? product.tax : 10,
    product ? product.food : false,
    code,
    !product
  );
  document.getElementById('suggest-box').innerHTML = '';
}

function openEditPanel(name, price, tax, food, code, isNew) {
  document.getElementById('e-name').value = name;
  document.getElementById('e-price').value = price;
  document.getElementById('e-qty').value = 1;
  document.getElementById('e-tax').value = tax;
  document.getElementById('e-discount').value = 0;
  document.getElementById('direct-chk').checked = false;
  document.getElementById('direct-price-row').classList.remove('show');
  document.getElementById('normal-fields').style.display = 'block';
  document.getElementById('direct-price').value = '';
  document.getElementById('edit-panel').dataset.code = code;
  document.getElementById('edit-panel').classList.add('show');
  document.getElementById('edit-panel').scrollIntoView({behavior:'smooth'});
  if(isNew) toast('⚠️ 未登録の番号です。商品名・単価を入力してください');
  else toast('✅ ' + name + ' が見つかりました');
  updateEditPreview();
}

function closePanel() {
  document.getElementById('edit-panel').classList.remove('show');
  document.getElementById('barcode-input').value = '';
}

// ========== 直接入力トグル ==========
function toggleDirect() {
  const chk = document.getElementById('direct-chk');
  const row = document.getElementById('direct-price-row');
  const fields = document.getElementById('normal-fields');
  if(chk.checked) {
    row.classList.add('show');
    fields.style.opacity = '0.4';
    document.getElementById('direct-price').focus();
  } else {
    row.classList.remove('show');
    fields.style.opacity = '1';
  }
  updateEditPreview();
}

// ========== 編集プレビュー ==========
function updateEditPreview() {
  const isDirect = document.getElementById('direct-chk').checked;
  let preview = '';
  if(isDirect) {
    const total = parseInt(document.getElementById('direct-price').value)||0;
    preview = `<span style="font-size:18px;font-weight:700;color:var(--pd)">税込 ¥${total.toLocaleString()}</span>`;
  } else {
    const name = document.getElementById('e-name').value||'（商品名未入力）';
    const price = parseFloat(document.getElementById('e-price').value)||0;
    const qty = parseInt(document.getElementById('e-qty').value)||1;
    const tax = parseInt(document.getElementById('e-tax').value)||10;
    const disc = parseFloat(document.getElementById('e-discount').value)||0;
    const subtotal = Math.floor(price*(1-disc/100)*qty);
    const taxAmt = Math.floor(subtotal*(tax/100));
    const total = subtotal + taxAmt;
    preview = `${name} × ${qty}個<br>税抜 ¥${subtotal.toLocaleString()} + 税${tax}% ¥${taxAmt.toLocaleString()} = <span style="font-weight:700;color:var(--pd)">税込 ¥${total.toLocaleString()}</span>${disc>0?` <span style="color:var(--red)">(-${disc}%割引)</span>`:''}`;
  }
  document.getElementById('edit-preview').innerHTML = preview;
}

// ========== 明細に追加 ==========
function addFromPanel() {
  const isDirect = document.getElementById('direct-chk').checked;
  const code = document.getElementById('edit-panel').dataset.code || '';
  if(isDirect) {
    const totalPrice = parseInt(document.getElementById('direct-price').value)||0;
    if(!totalPrice) { toast('⚠️ 金額を入力してください'); return; }
    const name = document.getElementById('e-name').value || '直接入力';
    items.push({ name, price: totalPrice, qty: 1, tax: 0, discount: 0, code, isDirect: true });
  } else {
    const name = document.getElementById('e-name').value.trim();
    const price = parseFloat(document.getElementById('e-price').value)||0;
    const qty = parseInt(document.getElementById('e-qty').value)||1;
    const tax = parseInt(document.getElementById('e-tax').value)||10;
    const discount = parseFloat(document.getElementById('e-discount').value)||0;
    if(!name) { toast('⚠️ 商品名を入力してください'); return; }
    items.push({ name, price, qty, tax, discount, code, isDirect: false });
  }
  renderItems();
  updateBadge();
  closePanel();
  toast('✅ 明細に追加しました');
}

// ========== 明細レンダリング ==========
function changeQty(i,d){ items[i].qty=Math.max(1,items[i].qty+d); renderItems(); updateBadge(); }
function removeItem(i){ items.splice(i,1); renderItems(); updateBadge(); }
function clearItems(){ if(items.length&&confirm('明細をすべてクリアしますか？')){ items=[]; renderItems(); updateBadge(); } }

function renderItems() {
  const el = document.getElementById('items-list');
  if(!items.length){ el.innerHTML='<div class="empty-state">商品を追加してください</div>'; return; }
  el.innerHTML = items.map((item,i)=>{
    let sub, taxLabel;
    if(item.isDirect){
      sub = item.price;
      taxLabel = `<span class="tax-badge" style="background:#f0f0f0;color:#666">税込直接入力</span>`;
    } else {
      sub = Math.floor(item.price*(1-item.discount/100)*item.qty);
      const taxAmt = Math.floor(sub*(item.tax/100));
      sub = sub + taxAmt;
      taxLabel = `<span class="tax-badge tax-${item.tax}">${item.tax}%</span>`;
    }
    return `<div class="item-row">
      <div class="item-name">${item.name}</div>
      <div class="item-meta">
        <span class="item-price">¥${sub.toLocaleString()}</span>
        ${taxLabel}
        ${item.discount>0?`<span class="disc-badge">-${item.discount}%</span>`:''}
      </div>
      ${!item.isDirect?`<div style="display:flex;gap:8px;margin-top:6px;align-items:center">
        <div class="qty-ctrl">
          <button onclick="changeQty(${i},-1)">−</button>
          <span>${item.qty}</span>
          <button onclick="changeQty(${i},1)">＋</button>
        </div>
        <span style="font-size:12px;color:var(--mu)">単価¥${item.price.toLocaleString()}</span>
      </div>`:''}
      <button class="item-del" onclick="removeItem(${i})">✕</button>
    </div>`;
  }).join('');
}

function updateBadge(){
  const b=document.getElementById('item-count');
  if(items.length){b.style.display='flex';b.textContent=items.length;}else b.style.display='none';
}

// ========== 計算 ==========
function calcTotals(){
  let subtotal=0,totalDiscount=0,base8=0,base10=0,directTotal=0;
  items.forEach(item=>{
    if(item.isDirect){ directTotal+=item.price; return; }
    const orig=item.price*item.qty, disc=orig*(item.discount/100), after=orig-disc;
    subtotal+=orig; totalDiscount+=disc;
    if(item.tax===8) base8+=after; else base10+=after;
  });
  const tax8=Math.floor(base8*0.08), tax10=Math.floor(base10*0.10);
  const total=Math.floor(base8+base10)+tax8+tax10+directTotal;
  return {subtotal,totalDiscount,base8,base10,tax8,tax10,directTotal,total};
}

function updateSummary(){
  const c=calcTotals();
  document.getElementById('s-subtotal').textContent='¥'+Math.floor(c.subtotal).toLocaleString();
  document.getElementById('s-discount').textContent='-¥'+Math.floor(c.totalDiscount).toLocaleString();
  document.getElementById('s-tax8base').textContent='¥'+Math.floor(c.base8).toLocaleString();
  document.getElementById('s-tax8').textContent='¥'+c.tax8.toLocaleString();
  document.getElementById('s-tax10base').textContent='¥'+Math.floor(c.base10).toLocaleString();
  document.getElementById('s-tax10').textContent='¥'+c.tax10.toLocaleString();
  document.getElementById('s-total').textContent='¥'+c.total.toLocaleString();
}

// ========== カメラ ==========
async function toggleCamera(){
  if(cameraActive){ stopCamera(); return; }
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}});
    const video=document.getElementById('camera-view');
    video.srcObject=stream;
    document.getElementById('camera-wrap').style.display='block';
    document.getElementById('cam-icon').textContent='⏹';
    document.getElementById('cam-text').textContent='カメラ停止';
    cameraActive=true;
  }catch(e){ toast('❌ カメラエラー: '+e.message); }
}

function stopCamera(){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  stream=null;
  document.getElementById('camera-wrap').style.display='none';
  document.getElementById('cam-icon').textContent='📷';
  document.getElementById('cam-text').textContent='カメラを起動';
  cameraActive=false;
}

async function captureAndScan(){
  const video=document.getElementById('camera-view');
  const canvas=document.getElementById('camera-canvas');
  canvas.width=video.videoWidth; canvas.height=video.videoHeight;
  canvas.getContext('2d').drawImage(video,0,0);
  document.getElementById('scan-status').textContent='解析中...';
  if('BarcodeDetector' in window){
    try{
      const detector=new BarcodeDetector({formats:['ean_13','ean_8','code_128','code_39','itf','upc_a','upc_e']});
      const codes=await detector.detect(canvas);
      if(codes.length>0){
        const raw=codes[0].rawValue;
        document.getElementById('scan-status').textContent='読取: '+raw;
        document.getElementById('barcode-input').value=raw;
        stopCamera();
        searchByCode();
      } else {
        document.getElementById('scan-status').textContent='読み取れませんでした。もう一度試してください';
      }
    }catch(e){ document.getElementById('scan-status').textContent='解析エラー: '+e.message; }
  } else {
    document.getElementById('scan-status').textContent='バーコード解析非対応。処理番号を直接入力してください';
    stopCamera();
  }
}

    <p class="r-center" style="font-size:11px;color:var(--mu)">${rno}</p>
    <div class="r-line"></div>
    <p style="font-size:15px;margin:8px 0;font-weight:600">${recipient} 様</p>
    <div class="total-box">
      <div style="font-size:11px;color:var(--mu)">合計金額（税込）</div>
      <div style="font-size:30px;font-weight:700;color:var(--pd)">¥${c.total.toLocaleString()}</div>
    </div>
    <p style="margin-bottom:10px">但し：${purpose}</p>
    <div class="r-line"></div>
    <table>${rows}</table>
    <div class="r-line"></div>
    <table style="font-size:11px">
      <tr><td>小計（税抜）</td><td style="text-align:right">¥${Math.floor(c.subtotal).toLocaleString()}</td></tr>
      ${c.totalDiscount>0?`<tr><td style="color:var(--red)">値引き</td><td style="text-align:right;color:var(--red)">-¥${Math.floor(c.totalDiscount).toLocaleString()}</td></tr>`:''}
      <tr><td>8%対象（税抜）</td><td style="text-align:right">¥${Math.floor(c.base8).toLocaleString()}</td></tr>
      <tr><td>　消費税8%</td><td style="text-align:right">¥${c.tax8.toLocaleString()}</td></tr>
      <tr><td>10%対象（税抜）</td><td style="text-align:right">¥${Math.floor(c.base10).toLocaleString()}</td></tr>
      <tr><td>　消費税10%</td><td style="text-align:right">¥${c.tax10.toLocaleString()}</td></tr>
      ${c.directTotal>0?`<tr><td>直接入力合計</td><td style="text-align:right">¥${c.directTotal.toLocaleString()}</td></tr>`:''}
    </table>
    <div class="r-line"></div>
    <p class="r-right" style="font-size:11px;color:var(--mu)">${date}</p>
    <p class="r-center" style="margin-top:8px;font-weight:700;font-size:14px">メナード北谷美浜店</p>
  `;
  document.getElementById('preview-modal').style.display='block';
}

function closePreview(){ document.getElementById('preview-modal').style.display='none'; }

// ========== Excel出力 ==========
function exportExcel(){
  if(!items.length){ toast('⚠️ 商品を追加してください'); return; }
  const c=calcTotals();
  const wb=XLSX.utils.book_new();
  const ws_data=[
    ['領収書'],[''],
    ['領収書番号',document.getElementById('receipt-no').value],
    ['発行日',document.getElementById('issue-date').value],[''],
    ['宛名',document.getElementById('recipient').value+' 様'],
    ['但し書き',document.getElementById('purpose').value],[''],
    ['商品名','単価','数量','割引率','税率','小計（税込）'],
    ...items.map(item=>item.isDirect
      ?[item.name,'直接入力',1,'0%','税込',item.price]
      :[item.name,item.price,item.qty,item.discount+'%',item.tax+'%',Math.floor(item.price*(1-item.discount/100)*item.qty*(1+item.tax/100))]
    ),[''],
    ['小計（税抜）','','','','',Math.floor(c.subtotal)],
    ['値引き','','','','',-Math.floor(c.totalDiscount)],
    ['8%対象','','','','',Math.floor(c.base8)],['消費税8%','','','','',c.tax8],
    ['10%対象','','','','',Math.floor(c.base10)],['消費税10%','','','','',c.tax10],
    ...(c.directTotal>0?[['直接入力合計','','','','',c.directTotal]]:[]),
    ['合計（税込）','','','','',c.total],
    [''],['発行者','メナード北谷美浜店'],
  ];
  const ws=XLSX.utils.aoa_to_sheet(ws_data);
  ws['!cols']=[{wch:28},{wch:12},{wch:6},{wch:8},{wch:8},{wch:14}];
  XLSX.utils.book_append_sheet(wb,ws,'領収書');
  const date=document.getElementById('issue-date').value;
  const rno=document.getElementById('receipt-no').value;
  XLSX.writeFile(wb,`領収書_${rno}_${date}.xlsx`);
  saveToDailyRecord();
  toast('📥 ダウンロードしました');
}


// ========== 日計表 ==========
let dailyRecords = JSON.parse(localStorage.getItem('menard_daily') || '[]');

function saveToDailyRecord() {
  const c = calcTotals();
  const staff = document.getElementById('staff-select').value;
  const recipient = document.getElementById('recipient').value || '−';
  const rno = document.getElementById('receipt-no').value;
  const date = document.getElementById('issue-date').value;
  const record = {
    rno, date, staff, recipient,
    subtotal: Math.floor(c.subtotal),
    discount: Math.floor(c.totalDiscount),
    tax8: c.tax8, tax10: c.tax10,
    direct: c.directTotal,
    total: c.total,
    items: items.map(i => ({...i})),
    time: new Date().toLocaleTimeString('ja-JP', {hour:'2-digit', minute:'2-digit'})
  };
  dailyRecords.push(record);
  localStorage.setItem('menard_daily', JSON.stringify(dailyRecords));
}

function renderDaily() {
  const today = new Date().toISOString().split('T')[0];
  const todayRecs = dailyRecords.filter(r => r.date === today);

  if (!todayRecs.length) {
    document.getElementById('daily-summary').innerHTML = '<div style="text-align:center;color:var(--mu);padding:20px">本日の発行はまだありません</div>';
    document.getElementById('daily-list').innerHTML = '<div class="empty-state">まだ発行がありません</div>';
    return;
  }

  // 集計
  const totalSales = todayRecs.reduce((s,r) => s + r.total, 0);
  const totalDiscount = todayRecs.reduce((s,r) => s + r.discount, 0);
  const tax8total = todayRecs.reduce((s,r) => s + r.tax8, 0);
  const tax10total = todayRecs.reduce((s,r) => s + r.tax10, 0);
  const byStaff = {};
  todayRecs.forEach(r => {
    byStaff[r.staff] = (byStaff[r.staff] || 0) + r.total;
  });

  // サマリー表示
  const staffRows = Object.entries(byStaff).map(([s,v]) =>
    `<div class="sum-row"><span>　${s}</span><span>¥${v.toLocaleString()}</span></div>`
  ).join('');

  document.getElementById('daily-summary').innerHTML = `
    <div class="summary-card">
      <div class="sum-row"><span>📋 発行枚数</span><span>${todayRecs.length}枚</span></div>
      <div class="sum-row discount"><span>値引き合計</span><span>-¥${totalDiscount.toLocaleString()}</span></div>
      <div class="sum-row"><span>消費税8%合計</span><span>¥${tax8total.toLocaleString()}</span></div>
      <div class="sum-row"><span>消費税10%合計</span><span>¥${tax10total.toLocaleString()}</span></div>
      <div class="sum-row" style="border-top:1px solid var(--bd);padding-top:8px;margin-top:4px"><span>担当者別売上</span><span></span></div>
      ${staffRows}
      <div class="sum-row total"><span>本日合計（税込）</span><span>¥${totalSales.toLocaleString()}</span></div>
    </div>`;

  // 一覧表示
  document.getElementById('daily-list').innerHTML = todayRecs.map((r, i) => `
    <div class="item-row">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
        <span style="font-size:12px;color:var(--mu)">${r.time} ${r.rno}</span>
        <span class="tax-badge" style="background:var(--pl);color:var(--pd)">${r.staff}</span>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:13px">${r.recipient} 様</span>
        <span style="font-weight:700;color:var(--pd);font-size:16px">¥${r.total.toLocaleString()}</span>
      </div>
      ${r.discount>0?`<div style="font-size:11px;color:var(--red)">値引き -¥${r.discount.toLocaleString()}</div>`:''}
    </div>`).join('');
}

function exportDailyExcel() {
  const today = new Date().toISOString().split('T')[0];
  const todayRecs = dailyRecords.filter(r => r.date === today);
  if (!todayRecs.length) { toast('⚠️ 本日の発行データがありません'); return; }

  const totalSales = todayRecs.reduce((s,r) => s + r.total, 0);
  const totalDiscount = todayRecs.reduce((s,r) => s + r.discount, 0);
  const tax8total = todayRecs.reduce((s,r) => s + r.tax8, 0);
  const tax10total = todayRecs.reduce((s,r) => s + r.tax10, 0);

  const wb = XLSX.utils.book_new();

  // 日計サマリーシート
  const summary = [
    ['メナード北谷美浜店　日計表'],
    ['集計日', today],[''],
    ['発行枚数', todayRecs.length + '枚'],
    ['値引き合計', -totalDiscount],
    ['消費税8%合計', tax8total],
    ['消費税10%合計', tax10total],
    ['本日合計（税込）', totalSales],[''],
    ['担当者別売上'],
  ];
  const byStaff = {};
  todayRecs.forEach(r => { byStaff[r.staff] = (byStaff[r.staff] || 0) + r.total; });
  Object.entries(byStaff).forEach(([s,v]) => summary.push([s, v]));
  summary.push(['']);
  summary.push(['時刻', '領収書番号', '担当者', '宛名', '売上（税込）', '値引き', '消費税8%', '消費税10%']);
  todayRecs.forEach(r => summary.push([r.time, r.rno, r.staff, r.recipient, r.total, -r.discount, r.tax8, r.tax10]));

  const ws = XLSX.utils.aoa_to_sheet(summary);
  ws['!cols'] = [{wch:14},{wch:20},{wch:10},{wch:16},{wch:14},{wch:12},{wch:12},{wch:12}];
  XLSX.utils.book_append_sheet(wb, ws, '日計表');

  // 明細シート
  const detail = [['領収書番号','担当者','商品名','単価','数量','割引率','税率','小計（税込）']];
  todayRecs.forEach(r => {
    r.items.forEach(item => {
      const sub = item.isDirect ? item.price : Math.floor(item.price*(1-item.discount/100)*item.qty*(1+item.tax/100));
      detail.push([r.rno, r.staff, item.name, item.isDirect?'直接入力':item.price, item.qty, item.discount+'%', item.isDirect?'税込':item.tax+'%', sub]);
    });
  });
  const ws2 = XLSX.utils.aoa_to_sheet(detail);
  ws2['!cols'] = [{wch:20},{wch:10},{wch:30},{wch:10},{wch:6},{wch:8},{wch:8},{wch:14}];
  XLSX.utils.book_append_sheet(wb, ws2, '明細');

  XLSX.writeFile(wb, `日計表_${today}.xlsx`);
  toast('📥 日計表をダウンロードしました');
}

function clearDaily() {
  if (confirm('本日の日計データをリセットしますか？')) {
    dailyRecords = dailyRecords.filter(r => r.date !== new Date().toISOString().split('T')[0]);
    localStorage.setItem('menard_daily', JSON.stringify(dailyRecords));
    renderDaily();
    toast('🗑 リセットしました');
  }
}

function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2500); }
</script>
